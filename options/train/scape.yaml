# general setting
name: scape
backend: dp # DataParallel
type: FeatContrastiveFMNetModel
num_gpu: 1 # fix it to 1! 
gpu_idx: 0 # 
manual_seed: 1234
non-isometric: false
partial: false

# path
path:
  resume_state: ~

# datasets
datasets:
  train_dataset:
    name: ScapeTrain
    type: PairScapeDataset
    phase: train
    data_root: ../data/SCAPE_r
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: False
    return_dist: False
  test_dataset:
    name: ScapeTest
    type: PairScapeDataset
    phase: test
    data_root: ../data/SCAPE_r
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_corr: True
    return_dist: True
  # setting for train dataset
  batch_size: 1
  num_worker: 16

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/SCAPE_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07

# training setting
train:
  total_epochs: 30
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 30
  losses:
    rfmnet_loss:
      type: RfmnetLoss
      loss_weight: 1.0
    contrast_loss:
      type: FeatContrastiveLoss
      w_inter: 1.0  # 
      w_intra: 0.1   # 
      tau_inter: 1.0
      tau_intra: 1.0  
      inter_top_k: 50
      intra_top_k: 50
      bidirectional: false #  True 

# validation setting
val:
  val_freq: 2000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 100
  save_checkpoint_freq: 2000
